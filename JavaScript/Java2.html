<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project</title>
</head>
<body>

<h1 id="myHeading">My JavaScript</h1>
<button onclick="changeHeadingText()">JavaScript is Fun</button>

<script>
    alert("Welcome to My Mini Project!");

    function changeHeadingText() {
        // Target the id of the HTML heading element
        var headingElement = document.getElementById("myHeading");
        // Assign new text to the HTML heading element
        headingElement.textContent = "New Heading Text";
    }
</script>

</body>
</html>
